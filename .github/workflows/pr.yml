name: Test

on:
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the code it tests. Without an explicit block the
# job inherits whatever the repository default is, which can include write scopes it never
# needs — and it runs against pull requests, including ones from forks.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
